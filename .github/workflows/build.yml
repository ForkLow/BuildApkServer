name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'Job ID dari bot'
        required: true
        type: string
      userId:
        description: 'User ID Telegram'
        required: true
        type: string
      payload:
        description: 'Payload data build'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build APK
        run: |
          # Di sini kamu bisa menggunakan ${{ github.event.inputs.jobId }} atau ${{ inputs.jobId }} jika diperlukan
          echo "Building untuk job: ${{ github.event.inputs.jobId }}"

      # ... sisa step build APK kamu ...

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: my_app/build/app/outputs/flutter-apk/app-release.apk
          tag_name: build-${{ github.run_number }}
          name: Build APK Release ${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
