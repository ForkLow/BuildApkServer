name: Build Flutter APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.x' # ✅ Pakai versi yang kompatibel dengan AGP 8
          channel: 'stable'
          cache: true

      - name: Extract ZIP Project
        run: |
          unzip -q project.zip -d my_app
          if [ ! -f "my_app/pubspec.yaml" ]; then
            echo "ERROR: File pubspec.yaml tidak ditemukan!"
            exit 1
          fi

      - name: Fix Gradle Compatibility
        run: |
          echo "android.newDsl=false" >> my_app/android/gradle.properties
          echo "android.builtInKotlin=false" >> my_app/android/gradle.properties
          echo "android.enableLegacyVariantApi=false" >> my_app/android/gradle.properties

      - name: Get Dependencies
        run: |
          cd my_app
          flutter pub get

      - name: Build APK
        run: |
          cd my_app
          flutter build apk --release --verbose

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: my_app/build/app/outputs/flutter-apk/app-release.apk
          tag_name: build-${{ github.run_number }}
          name: Build APK Release ${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
