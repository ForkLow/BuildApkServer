name: Build Flutter APK

on:
  workflow_dispatch:

permissions:
  contents: write # Izin buat bikin Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Extract ZIP Project
        run: |
          unzip project.zip -d my_app
          
      - name: Get Dependencies
        run: |
          cd my_app
          flutter pub get

      - name: Build APK
        run: |
          cd my_app
          flutter build apk --release

      # INI BAGIAN YANG DIUBAH: Langsung bikin Release GitHub biar dapet link .apk
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: my_app/build/app/outputs/flutter-apk/app-release.apk
          tag_name: build-${{ github.run_number }}
          name: Build APK Release ${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
