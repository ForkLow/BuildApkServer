name: Build Flutter APK

on:
  workflow_dispatch: # Biar bisa ditrigger lewat API dari aplikasi lu

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x' # Sesuaikan dengan versi Flutter project lu
          channel: 'stable'

      - name: Extract ZIP Project
        run: |
          # Asumsi file zip diupload ke repo dengan nama project.zip
          unzip project.zip -d my_app
          
      - name: Get Dependencies
        run: |
          cd my_app
          flutter pub get

      - name: Build APK
        run: |
          cd my_app
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: my_app/build/app/outputs/flutter-apk/app-release.apk
