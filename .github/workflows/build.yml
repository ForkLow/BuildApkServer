name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        required: true
        type: string
      userId:
        required: true
        type: string
      payload:
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Extract ZIP
        run: |
          unzip -q project.zip -d my_app

      - name: Find pubspec.yaml
        id: detect
        run: |
          PUBSPEC=$(find my_app -name "pubspec.yaml" -type f | head -1)
          if [ -z "$PUBSPEC" ]; then
            echo "❌ pubspec.yaml tidak ditemukan"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "✅ Project dir: $PROJECT_DIR"

      # ✅ STEP 1: UPDATE GRADLE KE 8.14
      - name: Update Gradle Wrapper
        run: |
          cd $PROJECT_DIR/android
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-all.zip|' gradle/wrapper/gradle-wrapper.properties
            echo "=== gradle-wrapper.properties ==="
            cat gradle/wrapper/gradle-wrapper.properties
          fi

      # ✅ STEP 2: UPDATE AGP, KOTLIN, & COMPILE SDK
      - name: Update AGP and Kotlin
        run: |
          cd $PROJECT_DIR/android
          
          # Cek file build.gradle.kts atau build.gradle
          if [ -f build.gradle.kts ]; then
            echo "=== Update root build.gradle.kts ==="
            cat build.gradle.kts
            
            # Update AGP ke 8.9.1
            sed -i 's|id("com.android.application") version "[^"]*" apply false|id("com.android.application") version "8.9.1" apply false|g' build.gradle.kts
            sed -i 's|id("org.jetbrains.kotlin.android") version "[^"]*" apply false|id("org.jetbrains.kotlin.android") version "2.1.0" apply false|g' build.gradle.kts
            
            echo "=== Setelah update ==="
            cat build.gradle.kts
          fi
          
          # Update app/build.gradle.kts
          if [ -f app/build.gradle.kts ]; then
            echo "=== app/build.gradle.kts ==="
            cat app/build.gradle.kts
            
            # Update compileSdk ke 35, targetSdk ke 35, minSdk ke 21
            sed -i 's|compileSdk = flutter.compileSdkVersion|compileSdk = 35|g' app/build.gradle.kts
            sed -i 's|targetSdk = flutter.targetSdkVersion|targetSdk = 35|g' app/build.gradle.kts
            sed -i 's|minSdk = flutter.minSdkVersion|minSdk = 21|g' app/build.gradle.kts
            
            # Update ndkVersion kalau ada
            sed -i 's|ndkVersion = flutter.ndkVersion|ndkVersion = "27.0.12077973"|g' app/build.gradle.kts
            
            echo "=== Setelah update ==="
            cat app/build.gradle.kts
          fi

      - name: Get Dependencies
        run: |
          cd $PROJECT_DIR
          flutter pub get

      - name: Build APK
        run: |
          cd $PROJECT_DIR
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Find APK
        run: |
          echo "=== SEMUA FILE APK ==="
          find my_app -name "*.apk" -type f -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: build-apk-release
          path: my_app/**/*.apk
          if-no-files-found: error
          retention-days: 1
